version: '3'

vars:
  PROJECT: <project>
  SECRETS: awskms://alias/{{.PROJECT}}-pulumi-secrets?region=eu-central-1
  DEV_ACCOUNT: '<dev-account>'
  PRD_ACCOUNT: '<prd-account>'

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install the Node dependencies of the tooling and the Pulumi projects
    cmds:
      - for: ['.', infra, infra/bootstrap, infra/shared]
        cmd: cd {{.ITEM}} && npm install --silent

  # The done gate. Keep the steps that fit the project, add the ones it needs (formatter, vet, build).
  # Run the test suite twice: a run that leaves state behind fails on the rerun.
  verify:
    desc: The full gate
    cmds:
      - task: install
      - npx --no-install markdownlint-cli --ignore node_modules -- '**/*.md'
      - for: [infra, infra/bootstrap, infra/shared]
        cmd: cd {{.ITEM}} && npx tsc --noEmit
      - task: test
      - task: test

  test:
    desc: Run the tests of the app and of the Pulumi program
    cmds:
      - echo "replace with the real test commands"

  # dev deploys from the dev branch, prd from main. shared (infra/shared) holds what every env shares.
  # Its state and secrets use the bucket and key of prd.
  # The wildcard is the env (dev|prd|shared). The task adds --stack, so no pulumi command that lacks it (login, version) fits.
  "pulumi:*":
    desc: "Run pulumi on the backend and stack of an env. Example: task pulumi:dev -- config set --secret basicAuth 'dev:<password>'"
    vars:
      ENV: '{{index .MATCH 0}}'
      ACCOUNT: '{{if eq .ENV "dev"}}{{.DEV_ACCOUNT}}{{else}}{{.PRD_ACCOUNT}}{{end}}'
      STACK_DIR: '{{if eq .ENV "shared"}}infra/shared{{else}}infra{{end}}'
      BACKEND: 's3://{{.PROJECT}}-pulumi-state-{{.ACCOUNT}}?region=eu-central-1'
    dir: '{{.STACK_DIR}}'
    preconditions:
      - &envKnown
        sh: '[ "{{.ENV}}" = dev ] || [ "{{.ENV}}" = prd ] || [ "{{.ENV}}" = shared ]'
        msg: 'The env is dev, prd or shared'
      - &accountMatches
        sh: '[ "$(aws sts get-caller-identity --query Account --output text)" = "{{.ACCOUNT}}" ]'
        msg: 'The AWS credentials are not for account {{.ACCOUNT}} ({{.ENV}}): run assume with the correct profile'
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: 'Pulumi args are missing: task pulumi:{{.ENV}} -- <pulumi args>'
    cmds:
      # Set on the command, not in env: a variable of the caller's shell wins over an env block.
      - PULUMI_BACKEND_URL='{{.BACKEND}}' pulumi {{.CLI_ARGS}} --stack {{.ENV}}

  "stack:*":
    desc: Create the stack on its backend if it does not exist (task stack:dev|prd|shared)
    vars:
      ENV: '{{index .MATCH 0}}'
    cmds:
      - task: 'pulumi:{{.ENV}}'
        vars: { CLI_ARGS: "stack select --create --secrets-provider '{{.SECRETS}}'" }

  "preview:*":
    desc: Show the diff a deploy makes (task preview:dev|prd|shared)
    vars:
      ENV: '{{index .MATCH 0}}'
    cmds:
      - task: 'stack:{{.ENV}}'
      - task: 'pulumi:{{.ENV}}'
        vars: { CLI_ARGS: 'preview --diff' }

  # Runs `pulumi up` on real infrastructure. Operator-invoked only, never from CI.
  "deploy:*":
    desc: Deploy one env from its branch, or shared from any branch (task deploy:dev|prd|shared)
    vars:
      ENV: '{{index .MATCH 0}}'
      BRANCH: '{{if eq .ENV "prd"}}main{{else}}dev{{end}}'
    preconditions:
      - *envKnown
      - sh: '[ "{{.ENV}}" = shared ] || [ "$(git rev-parse --abbrev-ref HEAD)" = "{{.BRANCH}}" ]'
        msg: '{{.ENV}} deploys only from the {{.BRANCH}} branch'
    cmds:
      - task: verify
      - task: 'stack:{{.ENV}}'
      - task: 'pulumi:{{.ENV}}'
        vars: { CLI_ARGS: 'up' }

  # infra/bootstrap's Pulumi.yaml pins the local backend. Its state holds no secrets.
  "bootstrap:*":
    desc: Account baseline - state bucket, KMS key, Lambda quota, console colour (task bootstrap:dev|prd)
    dir: infra/bootstrap
    vars:
      ENV: '{{index .MATCH 0}}'
      ACCOUNT: '{{if eq .ENV "dev"}}{{.DEV_ACCOUNT}}{{else}}{{.PRD_ACCOUNT}}{{end}}'
    env:
      PULUMI_CONFIG_PASSPHRASE: ""
    preconditions:
      - sh: '[ "{{.ENV}}" = dev ] || [ "{{.ENV}}" = prd ]'
        msg: 'The env is dev or prd'
      - *accountMatches
    cmds:
      - npm install --silent
      # The local backend, set on the command for the same reason as in pulumi.
      - PULUMI_BACKEND_URL='file://~' pulumi stack select --create --stack {{.ENV}}
      - PULUMI_BACKEND_URL='file://~' pulumi up --stack {{.ENV}}

  # Deletes data on real infrastructure. Operator-invoked only; the script refuses a non-dev account.
  reset-dev:
    desc: Empty the buckets and tables of dev and re-seed the stack rows, as after a first deploy
    prompt: Delete all data of dev?
    vars:
      ACCOUNT: '{{.DEV_ACCOUNT}}'
      BACKEND: 's3://{{.PROJECT}}-pulumi-state-{{.DEV_ACCOUNT}}?region=eu-central-1'
    env:
      ACCOUNT: '{{.ACCOUNT}}'
      BACKEND: '{{.BACKEND}}'
    cmds:
      - ./scripts/reset-dev.sh
